<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <script src="shared/ui/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — Inventaris Dinas Kebudayaan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles/login.css">
  <link rel="stylesheet" href="assets/styles/material.css">
  <link rel="stylesheet" href="assets/styles/theme.css">
</head>
<body data-page="login">

<div class="wrapper">
  <div class="brand">
    <div class="brand-icon"><span class="material-symbols-rounded filled" aria-hidden="true">account_balance</span></div>
    <div class="brand-title">Inventaris Barang</div>
    <div class="brand-subtitle">Dinas Kebudayaan — Kab. Bogor</div>
  </div>

  <div class="card">
    <div class="card-title">Masuk sebagai Admin</div>
    <div class="card-desc">Akses terbatas untuk petugas yang berwenang.</div>

    <div class="error-msg" id="error-msg">
      <span class="material-symbols-rounded" aria-hidden="true">warning</span>
      <span id="error-text">Email atau password salah.</span>
    </div>

    <div class="form-group">
      <label>Email</label>
      <div class="input-wrap">
        <span class="input-icon"><span class="material-symbols-rounded" aria-hidden="true">mail</span></span>
        <input type="email" id="email" placeholder="Masukkan email" autocomplete="email">
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon"><span class="material-symbols-rounded" aria-hidden="true">lock</span></span>
        <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password">
        <button class="toggle-pw" id="toggle-pw" type="button" title="Tampilkan password" aria-label="Tampilkan password"><span class="material-symbols-rounded" aria-hidden="true">visibility</span></button>
      </div>
    </div>

    <button class="btn-login" id="btn-login">
      <span class="btn-text">Masuk</span>
      <div class="spinner"></div>
    </button>

    <div class="footer-note">
      Lupa password? Hubungi administrator sistem.
    </div>
  </div>
</div>

<!-- Supabase -->
<script src="supabase.js"></script>
<script>
  const authClient = window.createSupabaseClient();

  // Jika sudah login, langsung ke index
  // FIX: disable tombol dulu selama cek session, cegah klik sebelum redirect
  const _btn = document.getElementById('btn-login');
  _btn.disabled = true;
  _btn.classList.add('loading');
  (async () => {
    const { data: { session } } = await authClient.auth.getSession();
    if (session) {
      window.location.replace('pages/index.html');
    } else {
      _btn.disabled = false;
      _btn.classList.remove('loading');
    }
  })();

  // Toggle show/hide password
  const pwInput = document.getElementById('password');
  const toggleBtn = document.getElementById('toggle-pw');
  toggleBtn.addEventListener('click', () => {
    const isHidden = pwInput.type === 'password';
    pwInput.type = isHidden ? 'text' : 'password';
    toggleBtn.querySelector('.material-symbols-rounded').textContent = isHidden ? 'visibility_off' : 'visibility';
    toggleBtn.title = isHidden ? 'Sembunyikan password' : 'Tampilkan password';
    toggleBtn.setAttribute('aria-label', toggleBtn.title);
  });

  // Enter key support
  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('btn-login').addEventListener('click', doLogin);

  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const btn      = document.getElementById('btn-login');
    const errorEl  = document.getElementById('error-msg');

    if (!email || !password) {
      showError('Email dan password wajib diisi.');
      return;
    }

    btn.disabled = true;
    btn.classList.add('loading');
    errorEl.classList.remove('show');

    const passwordAsli = document.getElementById('password').value;
    const { data, error } = await authClient.auth.signInWithPassword({ email, password: passwordAsli });

    if (error) {
      btn.disabled = false;
      btn.classList.remove('loading');

      const pesanError = {
        'invalid_credentials': 'Email atau password salah.',
        'email_not_confirmed': 'Email belum dikonfirmasi. Cek inbox email Anda.',
        'over_request_rate_limit': 'Terlalu banyak percobaan. Tunggu beberapa menit.',
        'user_not_found': 'Akun tidak ditemukan.',
        'Invalid login credentials': 'Email atau password salah.',
        'Email not confirmed': 'Email belum dikonfirmasi. Cek inbox email Anda.',
        'Too many requests': 'Terlalu banyak percobaan. Tunggu beberapa menit.',
      };

      const kunci = error.code || error.message;
      showError(pesanError[kunci] || `Error: ${error.message}`);
      document.querySelector('.card').classList.add('shake');
      setTimeout(() => document.querySelector('.card').classList.remove('shake'), 400);
    } else {
      window.location.replace('pages/index.html');
    }
  }

  function showError(msg) {
    document.getElementById('error-text').textContent = msg;
    document.getElementById('error-msg').classList.add('show');
  }
</script>

</body>
</html>
