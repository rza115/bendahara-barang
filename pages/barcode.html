<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <script src="../shared/ui/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Label Barcode — Inventaris Dinas Kebudayaan</title>
  <link rel="stylesheet" href="../assets/styles/style.css">
  <link rel="stylesheet" href="../assets/styles/sidebar.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="../assets/styles/barcode.css">
  <link rel="stylesheet" href="../assets/styles/material.css">
  <link rel="stylesheet" href="../assets/styles/presentation.css">
  <link rel="stylesheet" href="../assets/styles/theme.css">
</head>
<body data-page="barcode">

  <div class="loading-overlay" id="loading"><div class="loading-spinner"></div></div>
  <div class="alert" id="alert-box"></div>

  <div id="page-body">

    <div class="page-header">
      <div>
        <h1>Cetak Label Barcode</h1>
        <p>Pilih aset, atur opsi, lalu cetak atau unduh PDF label inventaris</p>
      </div>
      <a href="index.html" class="btn btn-secondary"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>Kembali</a>
    </div>

    <div class="barcode-toolbar">
      <div class="toolbar-group">
        <label for="opt-kertas">Ukuran Kertas:</label>
        <select id="opt-kertas">
          <option value="a4">A4 (210 × 297 mm)</option>
          <option value="folio">Folio/F4 (210 × 330 mm)</option>
          <option value="a3">A3 Landscape (420 × 297 mm)</option>
        </select>
      </div>
      <div class="toolbar-sep"></div>
      <div class="toolbar-group">
        <label for="opt-jenis-kode">Template Label:</label>
        <select id="opt-jenis-kode">
          <option value="qrcode">QR Code</option>
          <option value="barcode">Barcode (Code128)</option>
          <option value="bpkad">Identitas Barang (BPKAD)</option>
        </select>
      </div>
      <div class="toolbar-sep"></div>
      <div class="toolbar-group">
        <label>Tahun Inventarisasi:</label>
        <input type="number" id="opt-tahun" value="" min="2000" max="2099" class="barcode-year-input">
      </div>
      <div class="toolbar-sep" id="sep-data-kode"></div>
      <div class="toolbar-group" id="group-data-kode">
        <label>Data pada kode:</label>
        <select id="opt-data-kode">
          <option value="id">ID Barang</option>
          <option value="kode">Kode Barang</option>
          <option value="lengkap">Nama + Kode</option>
        </select>
      </div>
    </div>

    <div class="aset-selector">
      <div class="aset-selector-header">
        <div class="aset-selector-title"><span class="material-symbols-rounded" aria-hidden="true">checklist</span>Pilih Aset untuk Dicetak</div>
        <div class="aset-selector-actions">
          <button class="btn-sm" id="btn-pilih-semua">Pilih Semua</button>
          <button class="btn-sm" id="btn-batal-semua">Batal Semua</button>
        </div>
      </div>
      <div class="search-bar">
        <div class="search-field">
          <span class="material-symbols-rounded" aria-hidden="true">search</span>
          <input type="text" id="search-aset" placeholder="Cari nama barang atau kode...">
        </div>
        <select id="filter-kib">
          <option value="">Semua KIB</option>
          <option value="KIB A">KIB A</option>
          <option value="KIB B">KIB B</option>
          <option value="KIB C">KIB C</option>
          <option value="KIB E">KIB E</option>
        </select>
      </div>
      <div class="aset-list" id="aset-list">
        <div class="barcode-loading">⏳ Memuat data aset...</div>
      </div>
      <div class="selected-count">
        <span>Dipilih: <strong id="jumlah-dipilih">0</strong> aset</span>
        <button class="btn btn-primary barcode-generate-button" id="btn-generate">
          <span class="material-symbols-rounded" aria-hidden="true">sell</span>Generate Label
        </button>
      </div>
    </div>

    <div class="preview-section">
      <div class="preview-header">
        <div class="preview-title"><span class="material-symbols-rounded" aria-hidden="true">print</span>Preview Label</div>
        <div class="preview-actions">
          <button class="btn btn-secondary barcode-export-button" id="btn-print"><span class="material-symbols-rounded" aria-hidden="true">print</span>Cetak</button>
          <button class="btn btn-primary barcode-export-button"   id="btn-pdf"><span class="material-symbols-rounded" aria-hidden="true">picture_as_pdf</span>Download PDF</button>
        </div>
      </div>
      <div id="print-area">
        <div class="label-grid" id="label-grid">
          <div class="label-empty">Pilih aset di atas lalu klik <strong>Generate Label</strong></div>
        </div>
      </div>
    </div>

  </div>

  <script src="../supabase.js"></script>
  <script src="../shared/auth/auth-guard.js"></script>
  <script src="../nav.js"></script>
  <script src="../shared/utils/constants.js"></script>
  <script src="../shared/utils/dom.js"></script>
  <script src="../shared/utils/formatters.js"></script>
  <script src="../shared/ui/feedback.js"></script>
  <script src="../features/barcode/barcode-service.js"></script>
  <script src="../features/barcode/barcode-page.js"></script>
  <script src="../main.js"></script>
</body>
</html>
