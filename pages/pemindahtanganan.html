<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <script src="../shared/ui/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemindahtanganan Barang — Inventaris Kecamatan Tenjo</title>
  <link rel="stylesheet" href="../assets/styles/sidebar.css">
  <link rel="stylesheet" href="../assets/styles/style.css">
  <link rel="stylesheet" href="../assets/styles/material.css">
  <link rel="stylesheet" href="../assets/styles/presentation.css">
  <link rel="stylesheet" href="../assets/styles/theme.css">
</head>
<body data-page="pemindahtanganan">

  <div class="loading-overlay" id="loading"><div class="loading-spinner"></div></div>
  <div class="alert" id="alert-box"></div>

  <div id="page-body">
    <div class="page-header">
      <div>
        <h1>Pemindahtanganan Barang</h1>
        <p>Catat perpindahan penanggung jawab barang secara permanen</p>
      </div>
      <a href="index.html" class="btn btn-secondary"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>Kembali</a>
    </div>

    <div class="form-card transfer-form-card">
      <div class="form-section">
        <div class="form-section-title" id="form-title"><span class="material-symbols-rounded" aria-hidden="true">add</span>Catat Pemindahtanganan Baru</div>
        <div class="form-grid">

          <div class="form-group">
            <label>Barang <span class="req">*</span></label>
            <select id="pt-barang-id">
              <option value="">— Pilih Barang —</option>
            </select>
          </div>

          <div class="form-group">
            <label>Penanggung Jawab Lama</label>
            <input type="text" id="pt-pj-lama-display" readonly
              placeholder="Otomatis dari data barang" class="readonly-field">
            <input type="hidden" id="pt-dari-pj-id">
          </div>

          <div class="form-group">
            <label>Penanggung Jawab Baru <span class="req">*</span></label>
            <select id="pt-ke-pj-id">
              <option value="">— Pilih PJ Baru —</option>
            </select>
          </div>

          <div class="form-group">
            <label>Tanggal Pemindahtanganan <span class="req">*</span></label>
            <input type="date" id="pt-tanggal">
          </div>

          <div class="form-group">
            <label>No. Dokumen <span class="text-muted-light">(BA/SK, opsional)</span></label>
            <input type="text" id="pt-no-dokumen" placeholder="contoh: 800/123/Kec.Tnj/2026">
          </div>

          <div class="form-group form-col-full">
            <label>Keterangan <span class="text-muted-light">(opsional)</span></label>
            <textarea id="pt-keterangan" rows="2" placeholder="Alasan pemindahtanganan, dasar hukum, dll..."></textarea>
          </div>

          <div class="form-group form-col-full">
            <label>Upload Dokumen <span class="text-muted-light">(scan BA/SK, opsional)</span></label>
            <input type="file" id="pt-dokumen-file" accept=".pdf,.jpg,.jpeg,.png">
            <p class="field-hint">Format: PDF/JPG/PNG · Maks. 5 MB</p>
          </div>

        </div>
        <div class="transfer-actions">
          <button class="btn btn-primary" id="btn-simpan-pt"><span class="material-symbols-rounded" aria-hidden="true">save</span>Simpan Pemindahtanganan</button>
          <button class="btn btn-secondary is-initially-hidden" id="btn-batal-pt"><span class="material-symbols-rounded" aria-hidden="true">close</span>Batal</button>
        </div>
      </div>
    </div>

    <div class="form-card">
      <div class="form-section">
        <div class="form-section-title"><span class="material-symbols-rounded" aria-hidden="true">history</span>Riwayat Pemindahtanganan</div>

        <div class="transfer-filters">
          <select id="filter-pt-barang" class="transfer-asset-filter">
            <option value="">— Semua Barang —</option>
          </select>
          <select id="filter-pt-pj" class="transfer-person-filter">
            <option value="">— Semua PJ —</option>
          </select>
        </div>

        <div class="scroll-x">
          <table class="transfer-table">
            <thead>
              <tr>
                <th class="transfer-table-heading">#</th>
                <th class="transfer-table-heading">Barang</th>
                <th class="transfer-table-heading">PJ Lama</th>
                <th class="transfer-table-heading">PJ Baru</th>
                <th class="transfer-table-heading">Tanggal</th>
                <th class="transfer-table-heading">No. Dok</th>
                <th class="transfer-table-heading">Aksi</th>
              </tr>
            </thead>
            <tbody id="pt-tbody">
              <tr><td colspan="7" class="table-loading">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</body>
<script src="../supabase.js"></script>
<script src="../shared/auth/auth-guard.js"></script>
<script src="../nav.js"></script>
<script src="../shared/utils/constants.js"></script>
<script src="../shared/utils/dom.js"></script>
<script src="../shared/utils/formatters.js"></script>
<script src="../shared/ui/feedback.js"></script>
<script src="../shared/media/dokumen-service.js"></script>
<script src="../features/pemindahtanganan/pt-service.js"></script>
<script src="../features/pemindahtanganan/pt-page.js"></script>
<script src="../main.js"></script>
</html>
